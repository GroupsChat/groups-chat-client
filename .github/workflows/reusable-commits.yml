name: Reusable Commits

on:
  workflow_call:
    inputs:
      validate-pr-title:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .github/tools/commitlint/package-lock.json
      - run: npm ci --prefix .github/tools/commitlint
      - name: Validate commit messages
        env:
          AFTER_SHA: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          commitlint=.github/tools/commitlint/node_modules/.bin/commitlint
          config=.github/tools/commitlint/commitlint.config.cjs
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            "$commitlint" --config "$config" --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
            exit 0
          fi
          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE_SHA"
            fi
            from_sha="$BEFORE_SHA"
          else
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            from_sha="$(git merge-base origin/main "$AFTER_SHA")"
          fi
          "$commitlint" --config "$config" --from "$from_sha" --to "$AFTER_SHA" --verbose
      - name: Validate pull request title
        if: inputs.validate-pr-title && github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          printf '%s\n' "$PR_TITLE" | .github/tools/commitlint/node_modules/.bin/commitlint \
            --config .github/tools/commitlint/commitlint.config.cjs --verbose
