name: Reusable Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=coverage/frontend/junit.xml
      - run: npm run build
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-reports-${{ github.run_id }}
          path: coverage/frontend/
          if-no-files-found: ignore
          retention-days: 14

  rust-coverage:
    name: Rust Tests and Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Select Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2
          fallback: none
      - name: Test and collect coverage
        working-directory: src-tauri
        run: |
          cargo llvm-cov --locked --html --output-dir ../coverage/rust
          cargo llvm-cov report --lcov --output-path ../coverage/rust/lcov.info
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-${{ github.run_id }}
          path: coverage/rust/
          if-no-files-found: ignore
          retention-days: 14
